<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Second Messenger</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        :root{--bg:#0a0a0a;--bg2:#1a1a1a;--bg3:#2c2c2c;--bg4:#3a3a3a;--text:#fff;--text2:#a9a9a9;--accent:#0088cc;--accent2:#006699;--danger:#e74c3c;--success:#2ecc71;--warning:#f39c12;--border:#2c2c2c;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.8)}
        .light{--bg:#f0f2f5;--bg2:#fff;--bg3:#e4e6eb;--bg4:#d8dadf;--text:#050505;--text2:#65676b;--border:#ced0d4;--shadow:0 8px 32px rgba(0,0,0,.1)}
        body{background:var(--bg);color:var(--text);height:100vh;transition:.3s;overflow:hidden}
        #app{max-width:1400px;height:100vh;margin:0 auto;display:flex;background:var(--bg);position:relative}
        .screen{display:none;width:100%;height:100%}
        .screen.active{display:flex;flex-direction:column}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:10px}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--bg2);color:var(--text);padding:14px 28px;border-radius:30px;border:1px solid var(--border);z-index:9999;display:none;box-shadow:var(--shadow);font-size:14px;max-width:90%;text-align:center}
        .toast.show{display:block;animation:slideUp .3s}
        @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .theme-btn{position:fixed;top:20px;right:20px;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:30px;cursor:pointer;z-index:999;font-size:14px;font-weight:500;transition:.3s;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
        .theme-btn:hover{background:var(--bg4);transform:scale(1.02)}
        
        /* AUTH */
        #authScreen{justify-content:center;align-items:center;padding:20px;background:var(--bg)}
        .auth-card{max-width:420px;width:100%;background:var(--bg2);padding:40px 32px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
        .auth-card .logo{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;box-shadow:0 4px 20px rgba(0,136,204,.3)}
        .auth-card h1{font-size:28px;margin-bottom:6px;letter-spacing:-.5px}
        .auth-card .sub{color:var(--text2);margin-bottom:30px;font-size:14px}
        .auth-card .input-group{margin-bottom:14px;text-align:left}
        .auth-card .input-group label{font-size:13px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
        .auth-card .input-group input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px;outline:none;transition:.3s}
        .auth-card .input-group input:focus{border-color:var(--accent)}
        .btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;transition:.3s;background:var(--accent);color:#fff;margin-top:8px}
        .btn:hover{opacity:.9;transform:scale(1.01)}
        .btn-danger{background:var(--danger)}
        .btn-success{background:var(--success)}
        .btn-warning{background:var(--warning)}
        .btn-google{background:var(--bg3);color:var(--text);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px}
        .btn-google:hover{background:var(--bg4)}
        .divider{margin:20px 0;border-top:1px solid var(--border);position:relative}
        .divider span{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--bg2);padding:0 15px;color:var(--text2);font-size:13px}
        .auth-error{color:var(--danger);font-size:14px;margin-bottom:12px;min-height:20px}
        
        /* MAIN */
        #mainApp{display:none;flex-direction:row;height:100vh;background:var(--bg)}
        #mainApp.active{display:flex}
        .sidebar{width:350px;min-width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%}
        .sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .sidebar-header h2{font-size:22px;display:flex;align-items:center;gap:10px}
        .sidebar-header h2 i{color:var(--accent)}
        .sidebar-header .actions{display:flex;gap:10px}
        .sidebar-header .actions i{font-size:20px;cursor:pointer;color:var(--text2);transition:.2s;padding:6px;border-radius:50%}
        .sidebar-header .actions i:hover{color:var(--text);background:var(--bg3)}
        .sidebar-header .actions .admin-icon{color:var(--danger)}
        .search-box{padding:12px 20px;border-bottom:1px solid var(--border)}
        .search-box input{width:100%;padding:10px 16px;border-radius:30px;border:none;background:var(--bg3);color:var(--text);outline:none;font-size:14px}
        .search-box input::placeholder{color:var(--text2)}
        .chat-list{flex:1;overflow-y:auto;padding:8px 0}
        .chat-item{display:flex;align-items:center;padding:12px 20px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--border);gap:14px}
        .chat-item:hover{background:var(--bg3)}
        .chat-item.active{background:var(--bg3)}
        .chat-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex-shrink:0;overflow:hidden}
        .chat-avatar img{width:100%;height:100%;object-fit:cover}
        .chat-info{flex:1;min-width:0}
        .chat-info .name{font-weight:600;display:flex;align-items:center;gap:6px}
        .chat-info .last-msg{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .verified-badge{color:var(--accent);margin-left:4px}
        
        /* CHAT */
        .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg)}
        .chat-area-header{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:14px}
        .chat-area-header .back-btn{display:none;cursor:pointer;font-size:20px}
        .chat-area-header .info{flex:1}
        .chat-area-header .info .name{font-weight:600;display:flex;align-items:center;gap:6px;font-size:17px}
        .chat-area-header .info .status{font-size:12px;color:var(--text2)}
        .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:4px}
        .message{max-width:70%;padding:10px 14px;border-radius:16px;background:var(--bg2);align-self:flex-start;word-wrap:break-word;border:1px solid var(--border)}
        .message.own{align-self:flex-end;background:var(--accent);color:#fff;border-color:var(--accent)}
        .message .msg-time{font-size:10px;opacity:.7;margin-top:4px;text-align:right}
        .message-input-area{padding:12px 20px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
        .message-input-area input{flex:1;padding:12px 18px;border-radius:30px;border:none;background:var(--bg3);color:var(--text);outline:none;font-size:14px}
        .message-input-area input::placeholder{color:var(--text2)}
        .message-input-area button{background:var(--accent);border:none;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;transition:.2s}
        .message-input-area button:hover{background:var(--accent2)}
        
        /* PROFILE */
        .profile-screen{display:none;flex:1;padding:30px;background:var(--bg);overflow-y:auto;justify-content:center}
        .profile-screen.active{display:flex}
        .profile-card{max-width:500px;width:100%;background:var(--bg2);border-radius:var(--radius);padding:30px;border:1px solid var(--border);text-align:center}
        .profile-avatar{width:120px;height:120px;border-radius:50%;background:var(--accent);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:#fff;overflow:hidden;cursor:pointer;position:relative}
        .profile-avatar img{width:100%;height:100%;object-fit:cover}
        .profile-avatar input{display:none}
        .profile-card input,.profile-card textarea{width:100%;padding:12px 16px;margin:8px 0;border-radius:12px;border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;font-size:14px}
        .profile-card textarea{resize:vertical;min-height:60px}
        .profile-card .btn{margin-top:12px}
        
        /* ADMIN PANEL */
        .admin-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(10px)}
        .admin-panel.active{display:flex}
        .admin-content{background:var(--bg2);max-width:1000px;width:100%;max-height:90vh;border-radius:var(--radius);padding:30px;overflow-y:auto;border:1px solid var(--border)}
        .admin-content h2{margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:24px}
        .admin-content h2 i{color:var(--danger)}
        .admin-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:10px}
        .admin-tabs button{background:var(--bg3);border:none;color:var(--text);padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600;transition:.3s}
        .admin-tabs button:hover{background:var(--bg4)}
        .admin-tabs button.active{background:var(--accent);color:#fff}
        .admin-tab-content{display:none}
        .admin-tab-content.active{display:block}
        
        /* Admin Stats */
        .admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:25px}
        .admin-stat-card{background:var(--bg3);padding:15px;border-radius:12px;text-align:center}
        .admin-stat-card .num{font-size:28px;font-weight:700;color:var(--accent)}
        .admin-stat-card .label{font-size:13px;color:var(--text2);margin-top:4px}
        
        /* Admin User List */
        .admin-user-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
        .admin-user-item .info{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
        .admin-user-item .info .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
        .admin-user-item .info .user-details{display:flex;flex-direction:column}
        .admin-user-item .info .user-details .email{font-size:12px;color:var(--text2)}
        .admin-user-item .info .user-details .name{display:flex;align-items:center;gap:5px}
        .admin-user-item .info .user-details .name .badge{font-size:10px;padding:1px 8px;border-radius:30px;background:var(--accent);color:#fff}
        .admin-user-item .info .user-details .name .badge.owner{background:var(--warning)}
        .admin-user-item .info .user-details .name .badge.banned{background:var(--danger)}
        .admin-user-item .info .user-details .name .badge.verified{background:var(--success)}
        .admin-user-item .actions{display:flex;gap:6px;flex-wrap:wrap}
        .admin-user-item .actions button{padding:5px 12px;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;transition:.2s;white-space:nowrap}
        .admin-user-item .actions button:hover{opacity:.8;transform:scale(.95)}
        .admin-user-item .actions .ban-btn{background:var(--danger);color:#fff}
        .admin-user-item .actions .unban-btn{background:var(--success);color:#fff}
        .admin-user-item .actions .verify-btn{background:var(--warning);color:#fff}
        .admin-user-item .actions .unverify-btn{background:var(--bg3);color:var(--text)}
        .admin-user-item .actions .delete-btn{background:var(--danger);color:#fff}
        
        /* Admin Support */
        .support-request{background:var(--bg3);padding:15px;border-radius:12px;margin-bottom:12px;border-left:3px solid var(--accent)}
        .support-request .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
        .support-request .header .user{font-weight:600;display:flex;align-items:center;gap:8px}
        .support-request .header .user .email{font-weight:400;color:var(--text2);font-size:13px}
        .support-request .header .time{font-size:12px;color:var(--text2)}
        .support-request .message{color:var(--text);margin-bottom:10px;padding:10px;background:var(--bg2);border-radius:8px}
        .support-request .answer-area{display:flex;gap:10px;flex-wrap:wrap}
        .support-request .answer-area input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none;min-width:150px;font-size:14px}
        .support-request .answer-area input:focus{border-color:var(--accent)}
        .support-request .answer-area button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:.3s}
        .support-request .answer-area .send-btn{background:var(--accent);color:#fff}
        .support-request .answer-area .send-btn:hover{background:var(--accent2)}
        .support-request .answer-area .close-btn{background:var(--danger);color:#fff}
        .support-request .answer-area .close-btn:hover{opacity:.8}
        .support-request .answer{background:var(--bg2);padding:10px;border-radius:8px;margin-top:8px;border-left:3px solid var(--success);color:var(--text)}
        .support-request .answer .label{font-size:12px;color:var(--text2);margin-bottom:4px}
        .support-request .status-badge{font-size:11px;padding:2px 10px;border-radius:30px;background:var(--warning);color:#fff}
        .support-request .status-badge.answered{background:var(--success)}
        .support-request .status-badge.closed{background:var(--bg3);color:var(--text2)}
        
        /* Admin Channels */
        .admin-channel-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
        .admin-channel-item .info{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
        .admin-channel-item .info .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
        .admin-channel-item .info .channel-details{display:flex;flex-direction:column}
        .admin-channel-item .info .channel-details .name{display:flex;align-items:center;gap:5px;font-weight:600}
        .admin-channel-item .info .channel-details .username{font-size:12px;color:var(--text2)}
        .admin-channel-item .actions{display:flex;gap:6px;flex-wrap:wrap}
        .admin-channel-item .actions button{padding:5px 12px;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;transition:.2s;white-space:nowrap}
        .admin-channel-item .actions button:hover{opacity:.8;transform:scale(.95)}
        .admin-channel-item .actions .verify-btn{background:var(--warning);color:#fff}
        .admin-channel-item .actions .unverify-btn{background:var(--bg3);color:var(--text)}
        .admin-channel-item .actions .delete-btn{background:var(--danger);color:#fff}
        
        .admin-close{position:sticky;bottom:0;background:var(--bg2);padding:15px 0 0;border-top:1px solid var(--border);margin-top:15px}
        
        /* SUPPORT BUTTON (for users) */
        .support-btn{position:fixed;bottom:30px;right:30px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:28px;cursor:pointer;box-shadow:var(--shadow);transition:.3s;z-index:100}
        .support-btn:hover{transform:scale(1.1)}
        .support-modal{display:none;position:fixed;bottom:100px;right:30px;background:var(--bg2);border-radius:var(--radius);padding:24px;width:380px;max-width:90vw;border:1px solid var(--border);box-shadow:var(--shadow);z-index:101}
        .support-modal.active{display:block}
        .support-modal textarea{width:100%;min-height:100px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;resize:vertical;font-size:14px}
        .support-modal textarea::placeholder{color:var(--text2)}
        .support-modal .btn{margin-top:10px}
        
        @media(max-width:768px){
            .sidebar{width:100%;min-width:0}
            .chat-area{display:none}
            .chat-area.active{display:flex;position:absolute;top:0;left:0;right:0;bottom:0;z-index:100;background:var(--bg)}
            .chat-area-header .back-btn{display:block}
            .profile-screen{padding:16px}
            .support-modal{right:10px;width:calc(100% - 20px);bottom:80px}
            .support-btn{bottom:20px;right:20px;width:50px;height:50px;font-size:24px}
            .admin-user-item,.admin-channel-item{flex-direction:column;align-items:stretch}
            .admin-user-item .actions,.admin-channel-item .actions{justify-content:center}
            .admin-content{padding:16px}
            .admin-stats{grid-template-columns:repeat(2,1fr)}
            .support-request .answer-area{flex-direction:column}
            .support-request .answer-area input{width:100%}
        }
    </style>
</head>
<body>
<div id="app">
    <div id="toast" class="toast"></div>
    <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i> <span id="themeLabel">Темная</span></button>

    <!-- AUTH -->
    <div id="authScreen" class="screen active">
        <div class="auth-card">
            <div class="logo"><i class="fas fa-paper-plane"></i></div>
            <h1>Second</h1>
            <p class="sub">Безопасный мессенджер</p>
            <div id="authError" class="auth-error"></div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="example@mail.com" value="owner@admin.com">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••" value="atashkas123solt">
            </div>
            <button class="btn" id="loginBtn">Войти</button>
            <button class="btn btn-google" id="googleBtn"><i class="fab fa-google"></i> Google</button>
            <div class="divider"><span>или</span></div>
            <button class="btn" id="registerBtn" style="background:var(--bg3);color:var(--text)">Создать аккаунт</button>
            <div style="margin-top:16px;font-size:13px;color:var(--text2)">👑 owner@admin.com / atashkas123solt</div>
        </div>
    </div>

    <!-- MAIN -->
    <div id="mainApp">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-paper-plane"></i> Second</h2>
                <div class="actions">
                    <i class="fas fa-user" id="profileBtn" title="Профиль"></i>
                    <i class="fas fa-user-shield admin-icon" id="adminBtn" title="Админ-панель" style="display:none"></i>
                    <i class="fas fa-sign-out-alt" id="logoutBtn" title="Выйти"></i>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Поиск...">
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-area-header">
                <span class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></span>
                <div class="chat-avatar" id="chatHeaderAvatar" style="width:40px;height:40px;font-size:16px">S</div>
                <div class="info">
                    <div class="name" id="chatHeaderName">Second</div>
                    <div class="status" id="chatHeaderStatus">Подписчиков: 0</div>
                </div>
                <i class="fas fa-info-circle" style="font-size:20px;color:var(--text2);cursor:pointer" id="chatInfoBtn"></i>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="message-input-area">
                <input type="text" id="messageInput" placeholder="Сообщение...">
                <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="profile-screen" id="profileScreen">
            <div class="profile-card">
                <h2 style="margin-bottom:20px"><i class="fas fa-user-circle"></i> Профиль</h2>
                <div class="profile-avatar" id="profileAvatar">
                    <span id="avatarText">U</span>
                    <input type="file" id="avatarUpload" accept="image/*">
                </div>
                <input type="text" id="profileName" placeholder="Имя">
                <input type="text" id="profileUsername" placeholder="Юзернейм">
                <textarea id="profileBio" placeholder="Описание"></textarea>
                <input type="date" id="profileBirthday">
                <button class="btn" id="saveProfileBtn">💾 Сохранить</button>
                <button class="btn btn-danger" id="deleteAccountBtn">🗑️ Удалить аккаунт</button>
                <button class="btn" id="closeProfileBtn" style="background:var(--bg3);color:var(--text)">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- SUPPORT (для пользователей) -->
    <button class="support-btn" id="supportBtn"><i class="fas fa-headset"></i></button>
    <div class="support-modal" id="supportModal">
        <h3 style="margin-bottom:10px"><i class="fas fa-life-ring" style="color:var(--accent)"></i> Поддержка</h3>
        <p style="color:var(--text2);font-size:14px;margin-bottom:10px">Опишите вашу проблему</p>
        <textarea id="supportMessage" placeholder="Опишите проблему..."></textarea>
        <button class="btn" id="sendSupportBtn">📤 Отправить</button>
        <button class="btn" id="closeSupportBtn" style="background:var(--bg3);color:var(--text);margin-top:6px">Закрыть</button>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-content">
            <h2><i class="fas fa-user-shield"></i> Админ-панель</h2>
            
            <div class="admin-tabs">
                <button class="active" data-tab="users">👥 Пользователи</button>
                <button data-tab="support">💬 Поддержка</button>
                <button data-tab="channels">📢 Каналы</button>
            </div>
            
            <!-- TAB: Users -->
            <div class="admin-tab-content active" id="tabUsers">
                <div class="admin-stats" id="adminStats"></div>
                <div id="adminUserList"></div>
            </div>
            
            <!-- TAB: Support -->
            <div class="admin-tab-content" id="tabSupport">
                <div id="supportRequestsList"></div>
            </div>
            
            <!-- TAB: Channels -->
            <div class="admin-tab-content" id="tabChannels">
                <div id="adminChannelList"></div>
            </div>
            
            <div class="admin-close">
                <button class="btn" id="closeAdminBtn">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
    apiKey: "AIzaSyBe7oWLm7xdT_YPHB3WHKCzc_SkOPljUxM",
    authDomain: "second-8be87.firebaseapp.com",
    projectId: "second-8be87",
    storageBucket: "second-8be87.firebasestorage.app",
    messagingSenderId: "1027523779536",
    appId: "1:1027523779536:web:bb2886ae3a0658092877d5"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== STATE =====
let currentUser = null;
let currentUserData = {};
let currentChatId = null;
let currentChatType = 'user';
let allChats = [];
let messagesUnsub = null;
let isOwner = false;
let supportUnsub = null;

const $ = id => document.getElementById(id);
const toast = $('toast');

function showToast(msg, duration = 3000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
}

function formatDate(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function getInitials(name) {
    if (!name) return '?';
    return name.trim().charAt(0).toUpperCase();
}

function getColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return `hsl(${Math.abs(h) % 360}, 70%, 50%)`;
}

function renderAvatar(el, name, photo) {
    if (photo) {
        el.innerHTML = `<img src="${photo}">`;
    } else {
        el.style.background = getColor(name);
        el.innerHTML = `<span style="font-size:20px;font-weight:700">${getInitials(name)}</span>`;
    }
}

// ===== THEME =====
let dark = true;
$('themeBtn').onclick = () => {
    dark = !dark;
    document.body.classList.toggle('light', !dark);
    $('themeLabel').textContent = dark ? 'Темная' : 'Светлая';
    $('themeBtn').innerHTML = `<i class="fas fa-${dark ? 'moon' : 'sun'}"></i> <span>${dark ? 'Темная' : 'Светлая'}</span>`;
};

// ===== AUTH =====
function setAuthError(msg) { $('authError').textContent = msg; }

$('loginBtn').onclick = async () => {
    const email = $('loginEmail').value.trim();
    const pass = $('loginPassword').value.trim();
    if (!email || !pass) return setAuthError('Заполните поля');
    try {
        await auth.signInWithEmailAndPassword(email, pass);
    } catch (e) { setAuthError(e.message); }
};

$('registerBtn').onclick = async () => {
    const email = $('loginEmail').value.trim();
    const pass = $('loginPassword').value.trim();
    if (!email || !pass || pass.length < 6) return setAuthError('Пароль > 6 символов');
    try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(cred.user.uid).set({
            name: email.split('@')[0],
            username: email.split('@')[0],
            bio: '',
            birthday: '',
            photoURL: '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isOwner: email === 'owner@admin.com',
            verified: email === 'owner@admin.com',
            isBanned: false,
            chats: []
        });
        showToast('✅ Аккаунт создан!');
    } catch (e) { setAuthError(e.message); }
};

$('googleBtn').onclick = async () => {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        const doc = await db.collection('users').doc(result.user.uid).get();
        if (!doc.exists) {
            await db.collection('users').doc(result.user.uid).set({
                name: result.user.displayName || result.user.email.split('@')[0],
                username: result.user.email.split('@')[0],
                bio: '',
                birthday: '',
                photoURL: result.user.photoURL || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isOwner: result.user.email === 'owner@admin.com',
                verified: result.user.email === 'owner@admin.com',
                isBanned: false,
                chats: []
            });
        }
    } catch (e) { setAuthError(e.message); }
};

$('logoutBtn').onclick = () => auth.signOut();

// ===== AUTH STATE =====
auth.onAuthStateChanged(async user => {
    if (user) {
        currentUser = user;
        $('authScreen').classList.remove('active');
        $('mainApp').classList.add('active');
        await loadUserData(user.uid);
        await loadChats();
        await createDefaultChannel();
        $('adminBtn').style.display = isOwner ? 'block' : 'none';
        if (isOwner) {
            loadAdminPanel();
            loadSupportRequests();
            loadChannelsList();
        }
    } else {
        currentUser = null;
        $('authScreen').classList.add('active');
        $('mainApp').classList.remove('active');
        if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
        if (supportUnsub) { supportUnsub(); supportUnsub = null; }
        $('chatMessages').innerHTML = '';
    }
});

// ===== LOAD USER =====
async function loadUserData(uid) {
    const doc = await db.collection('users').doc(uid).get();
    if (doc.exists) {
        currentUserData = doc.data();
        isOwner = currentUserData.isOwner || false;
        if (currentUserData.isBanned) {
            showToast('⛔ Аккаунт заблокирован!');
            setTimeout(() => auth.signOut(), 2000);
            return;
        }
        $('profileName').value = currentUserData.name || '';
        $('profileUsername').value = currentUserData.username || '';
        $('profileBio').value = currentUserData.bio || '';
        $('profileBirthday').value = currentUserData.birthday || '';
        const av = $('profileAvatar');
        if (currentUserData.photoURL) {
            av.innerHTML = `<img src="${currentUserData.photoURL}">`;
        } else {
            av.style.background = getColor(currentUserData.name || 'User');
            av.innerHTML = `<span style="font-size:32px">${getInitials(currentUserData.name || 'User')}</span>`;
        }
    }
}

// ===== DEFAULT CHANNEL =====
async function createDefaultChannel() {
    const snap = await db.collection('channels').where('name', '==', 'Second').get();
    if (snap.empty) {
        await db.collection('channels').add({
            name: 'Second',
            username: 'second',
            description: '📢 Официальный канал',
            ownerId: currentUser.uid,
            verified: true,
            photoURL: '',
            members: [currentUser.uid],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('📢 Канал Second создан!');
    }
}

// ===== LOAD CHATS =====
async function loadChats() {
    const uid = currentUser.uid;
    let chats = [];
    const ch = await db.collection('channels').where('members', 'array-contains', uid).get();
    ch.forEach(d => chats.push({ id: d.id, type: 'channel', ...d.data(), lastMsg: '' }));
    const gr = await db.collection('groups').where('members', 'array-contains', uid).get();
    gr.forEach(d => chats.push({ id: d.id, type: 'group', ...d.data(), lastMsg: '' }));
    const ud = await db.collection('users').doc(uid).get();
    const myChats = ud.exists ? ud.data().chats || [] : [];
    for (const cid of myChats) {
        const s = await db.collection('users').doc(cid).get();
        if (s.exists) {
            const d = s.data();
            if (!d.isBanned) chats.push({ id: cid, type: 'user', ...d, lastMsg: '' });
        }
    }
    allChats = chats;
    renderChatList(chats);
}

function renderChatList(chats) {
    const list = $('chatList');
    list.innerHTML = '';
    if (!chats.length) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">💬 Нет чатов</div>';
        return;
    }
    chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
        const av = document.createElement('div');
        av.className = 'chat-avatar';
        if (chat.photoURL) av.innerHTML = `<img src="${chat.photoURL}">`;
        else { av.style.background = getColor(chat.name || 'U'); av.textContent = getInitials(chat.name || 'U'); }
        const info = document.createElement('div');
        info.className = 'chat-info';
        const name = document.createElement('div');
        name.className = 'name';
        name.innerHTML = `${chat.name || 'Unknown'} ${chat.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}`;
        const last = document.createElement('div');
        last.className = 'last-msg';
        last.textContent = chat.lastMsg || 'Нет сообщений';
        info.appendChild(name); info.appendChild(last);
        div.appendChild(av); div.appendChild(info);
        div._chatId = chat.id;
        div._chatType = chat.type;
        div.onclick = () => openChat(chat.id, chat.type, chat);
        list.appendChild(div);
    });
}

// ===== OPEN CHAT =====
async function openChat(id, type, data) {
    currentChatId = id;
    currentChatType = type;
    const hName = $('chatHeaderName');
    const hAv = $('chatHeaderAvatar');
    const hStatus = $('chatHeaderStatus');
    if (type === 'channel') {
        const s = await db.collection('channels').doc(id).get();
        if (s.exists) {
            const d = s.data();
            hName.innerHTML = `${d.name} ${d.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}`;
            renderAvatar(hAv, d.name, d.photoURL);
            hStatus.textContent = `👥 Подписчиков: ${(d.members || []).length}`;
        }
    } else if (type === 'group') {
        const s = await db.collection('groups').doc(id).get();
        if (s.exists) {
            const d = s.data();
            hName.textContent = d.name || 'Группа';
            renderAvatar(hAv, d.name, d.photoURL);
            hStatus.textContent = `👥 Участников: ${(d.members || []).length}`;
        }
    } else {
        const s = await db.collection('users').doc(id).get();
        if (s.exists) {
            const d = s.data();
            hName.innerHTML = `${d.name || 'User'} ${d.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}`;
            renderAvatar(hAv, d.name, d.photoURL);
            hStatus.textContent = d.bio || 'Пользователь';
        }
    }
    if (window.innerWidth <= 768) {
        document.querySelector('.sidebar').style.display = 'none';
        $('chatArea').classList.add('active');
    }
    loadMessages(id, type);
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.chat-item').forEach(el => { if (el._chatId === id) el.classList.add('active'); });
}

// ===== LOAD MESSAGES =====
function loadMessages(id, type) {
    if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
    let coll = 'channels';
    if (type === 'group') coll = 'groups';
    else if (type === 'user') coll = 'users';
    messagesUnsub = db.collection(coll).doc(id).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snap => {
            const msgs = $('chatMessages');
            msgs.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                const div = document.createElement('div');
                div.className = `message ${d.senderId === currentUser.uid ? 'own' : ''}`;
                div.innerHTML = `<div>${d.text}</div><div class="msg-time">${formatDate(d.timestamp)}</div>`;
                msgs.appendChild(div);
            });
            msgs.scrollTop = msgs.scrollHeight;
        });
}

// ===== SEND MESSAGE =====
$('sendBtn').onclick = sendMessage;
$('messageInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage() {
    const text = $('messageInput').value.trim();
    if (!text || !currentChatId) return;
    if (currentChatType === 'channel') {
        const s = await db.collection('channels').doc(currentChatId).get();
        if (s.exists && s.data().name === 'Second' && !isOwner) {
            return showToast('⛔ Только владелец может писать в Second');
        }
    }
    try {
        let coll = 'channels';
        if (currentChatType === 'group') coll = 'groups';
        else if (currentChatType === 'user') coll = 'users';
        await db.collection(coll).doc(currentChatId).collection('messages').add({
            text, senderId: currentUser.uid,
            senderName: currentUser.displayName || 'User',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        $('messageInput').value = '';
    } catch (e) { showToast('❌ ' + e.message); }
}

// ===== BACK =====
$('backBtn').onclick = () => {
    $('chatArea').classList.remove('active');
    document.querySelector('.sidebar').style.display = 'flex';
};

// ===== PROFILE =====
$('profileBtn').onclick = () => $('profileScreen').classList.toggle('active');
$('closeProfileBtn').onclick = () => $('profileScreen').classList.remove('active');

$('saveProfileBtn').onclick = async () => {
    if (!currentUser) return;
    const name = $('profileName').value.trim();
    const username = $('profileUsername').value.trim();
    const bio = $('profileBio').value.trim();
    const birthday = $('profileBirthday').value;
    try {
        await db.collection('users').doc(currentUser.uid).update({
            name: name || 'User',
            username: username || name || 'user',
            bio, birthday
        });
        showToast('✅ Профиль сохранен');
        loadUserData(currentUser.uid);
        loadChats();
    } catch (e) { showToast('❌ ' + e.message); }
};

$('avatarUpload').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file || !currentUser) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
        try {
            await db.collection('users').doc(currentUser.uid).update({ photoURL: ev.target.result });
            showToast('✅ Аватар обновлен');
            loadUserData(currentUser.uid);
        } catch (err) { showToast('❌ ' + err.message); }
    };
    reader.readAsDataURL(file);
};

$('deleteAccountBtn').onclick = async () => {
    if (!confirm('Удалить аккаунт навсегда?')) return;
    try {
        await db.collection('users').doc(currentUser.uid).delete();
        await currentUser.delete();
        showToast('🗑️ Аккаунт удален');
        auth.signOut();
    } catch (e) { showToast('❌ ' + e.message); }
};

// ===== SEARCH =====
$('searchInput').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allChats.filter(c => 
        c.name?.toLowerCase().includes(q) || 
        c.username?.toLowerCase().includes(q)
    );
    renderChatList(filtered);
};

// ===== USER SUPPORT =====
$('supportBtn').onclick = () => $('supportModal').classList.toggle('active');
$('closeSupportBtn').onclick = () => $('supportModal').classList.remove('active');

$('sendSupportBtn').onclick = async () => {
    const msg = $('supportMessage').value.trim();
    if (!msg) return showToast('⚠️ Напишите вопрос');
    try {
        await db.collection('support').add({
            userId: currentUser.uid,
            userName: currentUserData.name || 'Unknown',
            userEmail: currentUser.email,
            message: msg,
            status: 'new',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('✅ Запрос отправлен! Ожидайте ответа');
        $('supportMessage').value = '';
        $('supportModal').classList.remove('active');
    } catch (e) { showToast('❌ ' + e.message); }
};

// ===== ADMIN PANEL =====
$('adminBtn').onclick = () => {
    $('adminPanel').classList.toggle('active');
    if ($('adminPanel').classList.contains('active')) {
        loadAdminPanel();
        loadSupportRequests();
        loadChannelsList();
    }
};
$('closeAdminBtn').onclick = () => $('adminPanel').classList.remove('active');

// Admin Tabs
document.querySelectorAll('.admin-tabs button').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.admin-tab-content').forEach(t => t.classList.remove('active'));
        const tabId = 'tab' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1);
        $(tabId).classList.add('active');
    };
});

// ===== ADMIN: USERS =====
async function loadAdminPanel() {
    if (!isOwner) return;
    const snap = await db.collection('users').get();
    let users = [], banned = 0, verified = 0;
    snap.forEach(d => {
        const data = d.data();
        data.uid = d.id;
        users.push(data);
        if (data.isBanned) banned++;
        if (data.verified) verified++;
    });
    $('adminStats').innerHTML = `
        <div class="admin-stat-card"><div class="num">${users.length}</div><div class="label">Всего пользователей</div></div>
        <div class="admin-stat-card"><div class="num">${banned}</div><div class="label">Заблокировано</div></div>
        <div class="admin-stat-card"><div class="num">${verified}</div><div class="label">Проверенных</div></div>
    `;
    const list = $('adminUserList');
    list.innerHTML = '';
    users.sort((a,b) => (a.isOwner ? -1 : 0) - (b.isOwner ? -1 : 0));
    users.forEach(user => {
        const div = document.createElement('div');
        div.className = 'admin-user-item';
        const info = document.createElement('div');
        info.className = 'info';
        const av = document.createElement('div');
        av.className = 'avatar';
        av.textContent = getInitials(user.name || 'U');
        av.style.background = getColor(user.name || 'U');
        const det = document.createElement('div');
        det.className = 'user-details';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'name';
        nameDiv.innerHTML = `${user.name || 'Без имени'} ${user.verified ? '✅' : ''}`;
        if (user.isOwner) { const b = document.createElement('span'); b.className = 'badge owner'; b.textContent = '👑 Владелец'; nameDiv.appendChild(b); }
        if (user.isBanned) { const b = document.createElement('span'); b.className = 'badge banned'; b.textContent = '⛔ Забанен'; nameDiv.appendChild(b); }
        if (user.verified && !user.isOwner) { const b = document.createElement('span'); b.className = 'badge verified'; b.textContent = '✅ Проверен'; nameDiv.appendChild(b); }
        const email = document.createElement('div');
        email.className = 'email';
        email.textContent = user.email || 'Нет email';
        det.appendChild(nameDiv); det.appendChild(email);
        info.appendChild(av); info.appendChild(det);
        const actions = document.createElement('div');
        actions.className = 'actions';
        if (!user.isOwner) {
            if (user.isBanned) {
                const btn = document.createElement('button');
                btn.className = 'unban-btn';
                btn.textContent = '🔓 Разбан';
                btn.onclick = () => toggleBan(user.uid, false);
                actions.appendChild(btn);
            } else {
                const btn = document.createElement('button');
                btn.className = 'ban-btn';
                btn.textContent = '🔒 Забанить';
                btn.onclick = () => toggleBan(user.uid, true);
                actions.appendChild(btn);
            }
            if (user.verified) {
                const btn = document.createElement('button');
                btn.className = 'unverify-btn';
                btn.textContent = '⭐ Убрать галочку';
                btn.onclick = () => toggleUserVerify(user.uid, false);
                actions.appendChild(btn);
            } else {
                const btn = document.createElement('button');
                btn.className = 'verify-btn';
                btn.textContent = '✅ Галочка';
                btn.onclick = () => toggleUserVerify(user.uid, true);
                actions.appendChild(btn);
            }
            const btn = document.createElement('button');
            btn.className = 'delete-btn';
            btn.textContent = '🗑️ Удалить';
            btn.onclick = () => deleteUser(user.uid);
            actions.appendChild(btn);
        }
        div.appendChild(info); div.appendChild(actions);
        list.appendChild(div);
    });
}

async function toggleBan(uid, ban) {
    if (!confirm(`${ban ? 'Заблокировать' : 'Разблокировать'} пользователя?`)) return;
    try {
        await db.collection('users').doc(uid).update({ isBanned: ban });
        showToast(`✅ ${ban ? 'Заблокирован' : 'Разблокирован'}`);
        loadAdminPanel();
    } catch (e) { showToast('❌ ' + e.message); }
}

async function toggleUserVerify(uid, verify) {
    try {
        await db.collection('users').doc(uid).update({ verified: verify });
        showToast(`✅ ${verify ? 'Галочка выдана' : 'Галочка удалена'}`);
        loadAdminPanel();
    } catch (e) { showToast('❌ ' + e.message); }
}

async function deleteUser(uid) {
    if (!confirm('УДАЛИТЬ аккаунт навсегда?')) return;
    try {
        await db.collection('users').doc(uid).delete();
        showToast('🗑️ Пользователь удален');
        loadAdminPanel();
    } catch (e) { showToast('❌ ' + e.message); }
}

// ===== ADMIN: SUPPORT =====
function loadSupportRequests() {
    if (supportUnsub) { supportUnsub(); supportUnsub = null; }
    supportUnsub = db.collection('support')
        .orderBy('createdAt', 'desc')
        .onSnapshot(snap => {
            const list = $('supportRequestsList');
            list.innerHTML = '';
            if (snap.empty) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">💬 Нет запросов</div>';
                return;
            }
            snap.forEach(doc => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'support-request';
                const statusText = data.status === 'answered' ? '✅ Отвечен' : data.status === 'closed' ? '🔒 Закрыт' : '🆕 Новый';
                const statusClass = data.status === 'answered' ? 'answered' : data.status === 'closed' ? 'closed' : '';
                div.innerHTML = `
                    <div class="header">
                        <div class="user">
                            <span>👤 ${data.userName || 'Неизвестный'}</span>
                            <span class="email">${data.userEmail || 'Нет email'}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="time">${formatDate(data.createdAt)}</div>
                    </div>
                    <div class="message">${data.message}</div>
                    ${data.answer ? `<div class="answer"><div class="label">📝 Ответ админа:</div>${data.answer}</div>` : ''}
                    <div class="answer-area">
                        <input type="text" placeholder="Написать ответ..." id="answerInput_${doc.id}">
                        <button class="send-btn" onclick="sendAnswer('${doc.id}')">📤 Ответить</button>
                        ${data.status !== 'closed' ? `<button class="close-btn" onclick="closeRequest('${doc.id}')">🔒 Закрыть</button>` : ''}
                    </div>
                `;
                list.appendChild(div);
            });
        });
}

window.sendAnswer = async function(docId) {
    const input = document.getElementById('answerInput_' + docId);
    const answer = input.value.trim();
    if (!answer) return showToast('⚠️ Напишите ответ');
    try {
        await db.collection('support').doc(docId).update({
            answer: answer,
            status: 'answered',
            answeredAt: firebase.firestore.FieldValue.serverTimestamp(),
            answeredBy: currentUser.uid
        });
        showToast('✅ Ответ отправлен пользователю');
        input.value = '';
    } catch (e) { showToast('❌ ' + e.message); }
};

window.closeRequest = async function(docId) {
    if (!confirm('Закрыть запрос?')) return;
    try {
        await db.collection('support').doc(docId).update({ status: 'closed' });
        showToast('🔒 Запрос закрыт');
    } catch (e) { showToast('❌ ' + e.message); }
};

// ===== ADMIN: CHANNELS =====
async function loadChannelsList() {
    if (!isOwner) return;
    const snap = await db.collection('channels').get();
    const list = $('adminChannelList');
    list.innerHTML = '';
    if (snap.empty) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">📢 Нет каналов</div>';
        return;
    }
    snap.forEach(doc => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = 'admin-channel-item';
        const info = document.createElement('div');
        info.className = 'info';
        const av = document.createElement('div');
        av.className = 'avatar';
        av.textContent = getInitials(data.name || 'C');
        av.style.background = getColor(data.name || 'C');
        const det = document.createElement('div');
        det.className = 'channel-details';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'name';
        nameDiv.innerHTML = `${data.name || 'Без имени'} ${data.verified ? '✅' : ''}`;
        const username = document.createElement('div');
        username.className = 'username';
        username.textContent = `@${data.username || 'нет юзернейма'} • Подписчиков: ${(data.members || []).length}`;
        det.appendChild(nameDiv); det.appendChild(username);
        info.appendChild(av); info.appendChild(det);
        const actions = document.createElement('div');
        actions.className = 'actions';
        if (data.verified) {
            const btn = document.createElement('button');
            btn.className = 'unverify-btn';
            btn.textContent = '⭐ Убрать галочку';
            btn.onclick = () => toggleChannelVerify(doc.id, false);
            actions.appendChild(btn);
        } else {
            const btn = document.createElement('button');
            btn.className = 'verify-btn';
            btn.textContent = '✅ Дать галочку';
            btn.onclick = () => toggleChannelVerify(doc.id, true);
            actions.appendChild(btn);
        }
        const btn = document.createElement('button');
        btn.className = 'delete-btn';
        btn.textContent = '🗑️ Удалить';
        btn.onclick = () => deleteChannel(doc.id);
        actions.appendChild(btn);
        div.appendChild(info); div.appendChild(actions);
        list.appendChild(div);
    });
}

async function toggleChannelVerify(channelId, verify) {
    try {
        await db.collection('channels').doc(channelId).update({ verified: verify });
        showToast(`✅ ${verify ? 'Галочка выдана' : 'Галочка удалена'} каналу`);
        loadChannelsList();
    } catch (e) { showToast('❌ ' + e.message); }
}

async function deleteChannel(channelId) {
    if (!confirm('Удалить канал навсегда?')) return;
    try {
        await db.collection('channels').doc(channelId).delete();
        showToast('🗑️ Канал удален');
        loadChannelsList();
        loadChats();
    } catch (e) { showToast('❌ ' + e.message); }
}

// ===== CHAT INFO =====
$('chatInfoBtn').onclick = async () => {
    if (!currentChatId) return;
    try {
        let data = null, type = '';
        if (currentChatType === 'channel') {
            const s = await db.collection('channels').doc(currentChatId).get();
            if (s.exists) { data = s.data(); type = 'Канал'; }
        } else if (currentChatType === 'group') {
            const s = await db.collection('groups').doc(currentChatId).get();
            if (s.exists) { data = s.data(); type = 'Группа'; }
        } else {
            const s = await db.collection('users').doc(currentChatId).get();
            if (s.exists) { data = s.data(); type = 'Пользователь'; }
        }
        if (data) {
            let info = `📋 ${type}\n`;
            info += `📌 Название: ${data.name || 'Без имени'}\n`;
            if (data.username) info += `🔑 Юзернейм: @${data.username}\n`;
            if (data.bio) info += `📝 Описание: ${data.bio}\n`;
            if (data.verified) info += `✅ Проверен\n`;
            if (data.members) info += `👥 Участников: ${data.members.length}`;
            showToast('📊 Информация в консоли');
            console.log(info);
        }
    } catch (e) { showToast('❌ ' + e.message); }
};
